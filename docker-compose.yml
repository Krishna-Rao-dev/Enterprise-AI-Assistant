services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      target: backend
    env_file:
      - .env
    environment:
      PG_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_rag
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_USER_ID: ${VITE_API_USER_ID:-u_isha}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  model-cache:
